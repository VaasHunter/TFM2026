<!--
 Fichero principal de configuración de WAZUH. Se detallan rutas, salidas de ficheros json, logs, notificaciones, configuraciones de agentes, alertas, etc.
Para una mejor visualización , solo se ha sanitizado el contenido de forma que solo se muestra los apartados que afectan a la infraestructura CTI . 
El fichero original incluye las configuraciones base para el correcto funcionamiento del SIEM.
-->

<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>smtp.example.wazuh.com</smtp_server>
    <email_from>wazuh@example.wazuh.com</email_from>
    <email_to>recipient@example.wazuh.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
    <update_check>yes</update_check>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>


<!-- Aqui se indican las reglas que disparan el bot de alertas de Telegram -->
<integration>
  <name>custom-telegram</name>
  <rule_id>200505</rule_id>
  <alert_format>json</alert_format>
</integration>

  
<!-- Archivo JSON donde Wazuh lee las alertas -->

<localfile>
    <log_format>json</log_format>
    <location>/var/ossec/logs/misp_alerts.json</location>
</localfile>

<!-- Ubicación del archivo de reglas local_rules.xml -->

<ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>
  
</ossec_config>


<ossec_config>
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

</ossec_config>

